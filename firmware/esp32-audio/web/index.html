<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberTrack</title>
<style>
:root{color-scheme:light;--ink:#242b29;--paper:#faf9f5;--line:#deded5;--accent:#d5ee65}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}
main{display:flex;flex-direction:column;gap:8px;max-width:440px;width:100%;margin:auto;padding:12px 12px max(10px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;min-height:26px}
h1{font-size:20px;letter-spacing:-.8px;margin:0}.badge{font-size:12px;color:#777}.badge.on{color:#3b641d}.badge.on:before{content:"●";margin-right:6px;font-size:9px}
.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 0;gap:6px;border-block:1px solid var(--line)}
.status article{min-width:0}.status article+article{border-left:1px solid var(--line);padding-left:6px}
.status strong{display:block;font-size:12px;line-height:16px;white-space:nowrap}
.status small{display:flex;gap:3px;min-height:14px;line-height:14px;font-size:10px;color:#686e65;font-variant-numeric:tabular-nums;white-space:nowrap}
.status span:empty{display:none}
.speed-control{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:12px}
.speed-control input{width:100%;min-width:0;height:28px;margin:0;accent-color:#789324;touch-action:pan-y}
.speed-control output{min-width:38px;text-align:right;font-variant-numeric:tabular-nums}.speed-control input:disabled{opacity:.35}
.hint{text-align:center;color:#777;font-size:11px;line-height:14px;margin:0}#hold-time{font-variant-numeric:tabular-nums}#hold-time.timing{color:var(--ink);font-weight:650}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
button{font:inherit;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:#fff;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:48px;min-width:0}
button:focus-visible,input:focus-visible{outline:3px solid #789324;outline-offset:2px}button:disabled{opacity:.35;cursor:default}
.pad button{height:48px;font-size:13px;touch-action:none}.pad button b{font-size:21px;line-height:1;font-weight:400;margin-right:6px;vertical-align:-1px}.pad button.held{background:var(--accent);border-color:#a8c33f}
.drive-speed,.distance-status{align-self:center;text-align:center;min-width:0;color:#686e65;font-size:11px;line-height:16px;white-space:nowrap}
.drive-speed{grid-column:1;grid-row:1}.distance-status{grid-column:3;grid-row:1}
.drive-speed strong,.distance-status strong{display:block;color:var(--ink);font-size:18px;line-height:24px;font-variant-numeric:tabular-nums}
.forward{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.backward{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
.effect-controls{margin:0;margin-top:clamp(0px,calc(8dvh - 44px),16px)}.effect-controls h2{font-size:13px;line-height:18px;margin:0 0 4px}
.effect-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.effect-grid.durations{grid-template-columns:repeat(6,minmax(0,1fr))}
.effect-grid button{padding:4px 2px;background:#edf1e5;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.effect-grid .effect-hold{background:transparent;border-color:#a8b49b;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.effect-hold strong{font-size:12px;line-height:14px}.effect-hold span{max-width:100%;font-size:9px;line-height:12px;color:#686e65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.effect-grid .effect-hold.held{background:var(--accent);border-color:#a8c33f}.effect-hold.held span{color:var(--ink)}
.frenzy-controls h2{display:flex;justify-content:space-between;align-items:center}.frenzy-controls h2 span{font-size:10px;font-weight:400;color:#686e65}.frenzy-controls button{background:#f3e6d3;border-color:#dbbe94}
.stop{width:100%;background:#b63831;color:white;border:0;font-weight:650;font-size:17px;min-height:48px}
#message{min-height:28px;line-height:14px;font-size:11px;margin:0;color:#686e65;text-align:center;overflow-wrap:anywhere}#message.error{color:#a9322b}
/* Compact by available height, including desktop windows and mobile browser chrome.
   Keep 44 px touch targets; allow natural scroll for zoom/extremely short windows. */
@media (max-height:740px){
 main{gap:4px;padding-top:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
 header{min-height:24px}.status{padding:6px 0}
 button{min-height:44px}.pad button{height:44px}.stop{min-height:44px}
}
@media (max-height:620px){
 main{gap:2px;padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
 .status{padding:4px 0}.effect-controls h2{font-size:12px;line-height:16px;margin-bottom:2px}
 .speed-control input{height:26px}
}
/* Reserve the measured dock height so no controls sit behind the stop button. */
main{padding-bottom:calc(var(--stop-bar-height,100px) + 6px)}
.stop-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:10;width:100%;max-width:440px;display:flex;flex-direction:column;gap:4px;padding:8px 12px max(10px,env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
@media(max-height:740px){.stop-bar{padding-top:6px;padding-bottom:max(8px,env(safe-area-inset-bottom))}}
@media(max-height:620px){.stop-bar{padding-top:4px;padding-bottom:max(6px,env(safe-area-inset-bottom))}}
</style>
</head>
<body><main>
<header><h1>CyberTrack</h1><span id="connection" class="badge" role="status">连接中</span></header>
<section class="status" aria-label="实时状态">
<article><strong id="direction">行走</strong><small><span id="move-state">等待连接</span><span id="move-time">—</span></small></article>
<article><strong id="water-label">水枪</strong><small><span id="water-state">等待连接</span><span id="water-time">—</span></small></article>
<article><strong id="bubbles-label">泡泡枪</strong><small><span id="bubbles-state">等待连接</span><span id="bubbles-time">—</span></small></article>
<article><strong id="ignition-label">点火线圈</strong><small><span id="ignition-state">等待连接</span><span id="ignition-time">—</span></small></article>
</section>
<div class="speed-control"><label for="move-speed">设定速度</label><input id="move-speed" type="range" min="60" max="100" step="1" value="100" aria-describedby="speed-value" disabled><output id="speed-value" for="move-speed">100%</output></div>
<p id="hold-time" class="hint">按住行走，松开停止</p>
<div class="pad" aria-label="行走方向">
<div class="drive-speed">行走速度<strong id="drive-speed">—</strong></div>
<section class="distance-status" aria-label="前方测距"><span>前方距离</span><strong id="distance-value">-</strong></section>
<button class="forward" data-direction="forward" aria-label="前进" disabled><b aria-hidden="true">↑</b>前进</button>
<button class="left" data-direction="left" aria-label="左转" disabled><b aria-hidden="true">←</b>左转</button>
<button class="backward" data-direction="backward" aria-label="后退" disabled><b aria-hidden="true">↓</b>后退</button>
<button class="right" data-direction="right" aria-label="右转" disabled><b aria-hidden="true">→</b>右转</button>
</div>
<section class="effect-controls" aria-label="喷水控制"><h2>喷水</h2><div class="effect-grid durations">
<button id="water" data-effect="water" data-duration="1000" aria-label="喷水1秒" disabled>1 秒</button>
<button id="water-3" data-effect="water" data-duration="3000" aria-label="喷水3秒" disabled>3 秒</button>
<button id="water-5" data-effect="water" data-duration="5000" aria-label="喷水5秒" disabled>5 秒</button>
<button id="water-10" data-effect="water" data-duration="10000" aria-label="喷水10秒" disabled>10 秒</button>
<button id="water-30" data-effect="water" data-duration="30000" aria-label="喷水30秒" disabled>30 秒</button>
<button id="water-hold" class="effect-hold" data-hold="water" aria-label="按住喷水，松开停止" disabled><strong>按住</strong><span id="water-hold-time">松开停止</span></button></div></section>
<section class="effect-controls" aria-label="吹泡泡控制"><h2>吹泡泡</h2><div class="effect-grid durations">
<button id="bubbles" data-effect="bubbles" data-duration="1000" aria-label="吹泡泡1秒" disabled>1 秒</button>
<button id="bubbles-3" data-effect="bubbles" data-duration="3000" aria-label="吹泡泡3秒" disabled>3 秒</button>
<button id="bubbles-5" data-effect="bubbles" data-duration="5000" aria-label="吹泡泡5秒" disabled>5 秒</button>
<button id="bubbles-10" data-effect="bubbles" data-duration="10000" aria-label="吹泡泡10秒" disabled>10 秒</button>
<button id="bubbles-30" data-effect="bubbles" data-duration="30000" aria-label="吹泡泡30秒" disabled>30 秒</button>
<button id="bubbles-hold" class="effect-hold" data-hold="bubbles" aria-label="按住吹泡泡，松开停止" disabled><strong>按住</strong><span id="bubbles-hold-time">松开停止</span></button></div></section>
<section class="effect-controls" aria-label="点火控制"><h2>点火</h2><div class="effect-grid">
<button id="ignition" data-effect="ignition" data-duration="1000" aria-label="点火1秒" disabled>1 秒</button>
<button id="ignition-3" data-effect="ignition" data-duration="3000" aria-label="点火3秒" disabled>3 秒</button>
<button id="ignition-5" data-effect="ignition" data-duration="5000" aria-label="点火5秒" disabled>5 秒</button>
</div></section>
<section class="effect-controls frenzy-controls" aria-label="狂暴模式控制"><h2>狂暴模式 <span id="frenzy-time">最长 30 秒</span></h2><div class="effect-grid">
<button id="frenzy-5" data-effect="frenzy" data-duration="5000" aria-label="狂暴模式5秒" disabled>5 秒</button>
<button id="frenzy-10" data-effect="frenzy" data-duration="10000" aria-label="狂暴模式10秒" disabled>10 秒</button>
<button id="frenzy-30" data-effect="frenzy" data-duration="30000" aria-label="狂暴模式30秒" disabled>30 秒</button>
</div></section>
</main>
<footer class="stop-bar" aria-label="停止控制">
<p id="message" role="status" aria-live="polite"></p>
<button id="stop" class="stop" disabled>全部停止</button>
</footer><script>
      "use strict";
      const $ = (id) => document.getElementById(id),
        directions = {
          forward: "前进",
          backward: "后退",
          left: "左转",
          right: "右转",
          none: "待命",
        };
      let token = "",
        epoch = 0,
        sequence = 0,
        windowId = 0,
        latest = -1,
        snapshot = null,
        pending = false,
        effectPending = false,
        speedDesired = null,
        speedJob = null,
        followingActivity = false,
        polling = false,
        timer,
        distanceTimer,
        displayedDistance = null,
        distanceChangedAt = 0,
        holds = { move: null, water: null, bubbles: null },
        startQueue = Promise.resolve(),
        pollWait = Promise.resolve();
      const reasons = {
        voice_preempted: "已停止语音动作，稍后可重新操作。",
        control_busy: "另一网页正在使用，等待连接。",
        pair_rate_limited: "操作太快，请稍后再连接。",
        session_expired: "连接已失效，正在重连。",
        not_ready_or_busy: "该动作正在运行、冷却或暂不可用。",
        stale_request: "请求已过期或被停止取消，请确认状态后重新操作。",
        duplicate_request: "重复请求已拒绝。",
        output_fault: "设备输出故障，请检查设备。",
        invalid_request: "参数无效，未执行。",
        cancelled_before_output: "动作已被停止或断连取消。",
        hold_cancelled: "长按已结束，请松开后重新按住。",
        drive_cancelled: "行走续租已取消，请松开后重新按住。",
      };
      function message(text, error = false, followActivity = false) {
        followingActivity = followActivity;
        $("message").textContent = text;
        $("message").className = error ? "error" : "";
      }
      function activityMessage(s) {
        if (s.state === "FAULT") { message("设备故障，动作已停止。", true); return; }
        if (s.boot_held) { message("BOOT 已按下，动作已停止。"); return; }
        if (s.sequence_active) {
          message("动作序列 " + s.sequence_step + "/" + s.sequence_steps +
            (s.sequence_result === "waiting" ? "：等待下一步。" : "：执行中。"), false, true);
          return;
        }
        const active = s.frenzy_remaining_ms > 0 ? ["狂暴模式"] :
          [["move", directions[s.move_direction] || "行走"], ["water", "喷水"],
           ["bubbles", "吹泡泡"], ["ignition", "点火"]]
            .filter(([kind]) => s[kind + "_remaining_ms"] > 0).map(([, label]) => label);
        if (!active.length && s.sequence_result === "cancelled") { message("动作序列已取消。"); return; }
        message(active.length ? "正在" + active.join("、") + "。" : "动作已结束。", false, active.length > 0);
      }
      function controls() {
        const ready =
          !!token &&
          !!snapshot &&
          !pending &&
          !document.hidden &&
          !snapshot.boot_held &&
          snapshot.state !== "FAULT" && !snapshot.frenzy_remaining_ms;
        const move =
          ready && (!snapshot?.move_remaining_ms || snapshot?.move_source === "voice") && !snapshot?.move_cooldown_ms;
        document.querySelectorAll("[data-direction]").forEach((b) => {
          const hold = holds.move;
          const active = hold && hold.button === b;
          b.disabled = hold
            ? !active
            : !(move && !effectPending);
          b.classList.toggle("held", !!active);
          b.setAttribute("aria-pressed", String(!!active));
        });
        for (const kind of ["water", "bubbles", "ignition"]) {
          const available = ready && snapshot?.capabilities?.[kind] === true &&
            (!snapshot?.[kind + "_remaining_ms"] || snapshot?.[kind + "_source"] === "voice") &&
            !snapshot?.[kind + "_cooldown_ms"];
          const disabled = !available || effectPending || !!holds[kind];
          document.querySelectorAll('[data-effect="' + kind + '"]').forEach(b => { b.disabled = disabled; });
          if (kind !== "ignition") {
            const h = holds[kind], b = $(kind + "-hold");
            b.disabled = h ? false : !available || snapshot?.capabilities?.[kind + "_hold"] !== true;
            b.classList.toggle("held", !!h);
            b.setAttribute("aria-pressed", String(!!h));
          }
        }
        const frenzyReady = ready && snapshot?.capabilities?.frenzy === true && !effectPending &&
          !Object.values(holds).some(Boolean) && ["move", "water", "bubbles", "ignition"].every(kind =>
            !snapshot?.[kind + "_remaining_ms"] && !snapshot?.[kind + "_cooldown_ms"]);
        document.querySelectorAll('[data-effect="frenzy"]').forEach(b => { b.disabled = !frenzyReady; });
        $("move-speed").disabled = !token || !snapshot || pending || document.hidden ||
          snapshot.boot_held || snapshot.state === "FAULT" || snapshot.capabilities?.speed_control !== true;
        $("stop").disabled = !token;
      }
      function clearDistance() {
        clearTimeout(distanceTimer);
        displayedDistance = null;
        $("distance-value").textContent = "-";
      }
      function renderDistance(s) {
        clearTimeout(distanceTimer);
        if (s.capabilities?.distance !== true) {
          clearDistance(); return;
        }
        const d = s.distance;
        const age = d?.age_ms;
        if (d?.valid === true && d.error === "none" && Number.isFinite(age) && age >= 0 && age <= 500 &&
            Number.isInteger(d.distance_mm) && d.distance_mm >= 20 && d.distance_mm <= 4000) {
          const cm = Math.round(d.distance_mm / 10), now = performance.now();
          const delta = Math.abs(cm - displayedDistance);
          // Suppress centimetre flicker, but follow large changes immediately.
          // Every fresh sample still refreshes expiry; invalid samples clear at once.
          if (displayedDistance === null || delta >= 10 || (delta >= 2 && now - distanceChangedAt >= 350)) {
            displayedDistance = cm;
            distanceChangedAt = now;
            $("distance-value").textContent = cm + " cm";
          }
          distanceTimer = setTimeout(() => clearDistance(), 501 - age);
        } else {
          clearDistance();
        }
      }
      function statusTime(ms) {
        if (ms < 60000) return (ms / 1000).toFixed(1) + " s";
        if (ms < 3600000) return Math.ceil(ms / 60000) + " min";
        return Math.ceil(ms / 3600000) + " h";
      }
      function render(s) {
        if (s.request_sequence <= latest) return;
        latest = s.request_sequence;
        snapshot = s;
        renderDistance(s);
        windowId = s.window;
        if (speedDesired === null) {
          $("move-speed").value = String(s.web_speed_percent ?? 100);
          $("speed-value").textContent = $("move-speed").value + "%";
        }
        $("frenzy-time").textContent = s.frenzy_remaining_ms > 0
          ? "剩余 " + (s.frenzy_remaining_ms / 1000).toFixed(1) + " 秒" : "最长 30 秒";
        for (const kind of ["move", "water", "bubbles", "ignition"]) {
          const active = s[kind + "_remaining_ms"] > 0,
            cool = s[kind + "_cooldown_ms"];
          $(kind + "-time").textContent =
            s[(kind === "move" ? "drive" : kind) + "_hold_id"]
              ? (kind === "move" ? "" : "持续")
              : active
                ? statusTime(s[kind + "_remaining_ms"])
                : "";
          $(kind + "-state").textContent = active
            ? (kind === "move" ? directions[s.move_direction] || "行走" : "")
            : s.boot_held
              ? "已停止"
              : s.state === "FAULT"
                ? "故障"
                : cool
                  ? "冷却"
                  : "待命";
        }
        $("drive-speed").textContent = s.move_speed_percent > 0 ? s.move_speed_percent + "%" : "—";
        if (followingActivity || s.sequence_active) activityMessage(s);
        controls();
      }
      async function request(path, body = {}, auth = token, timeoutMs = 1100) {
        const started = performance.now();
        const abort = new AbortController(),
          timeout = setTimeout(() => abort.abort(), timeoutMs);
        try {
          const response = await fetch(path, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CyberTrack-Client": "1",
              ...(auth ? { "X-CyberTrack-Token": auth } : {}),
            },
            body: JSON.stringify(body),
            cache: "no-store",
            signal: abort.signal,
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.result || "request_failed");
          // Conservatively include the whole round trip, so delayed responses
          // cannot make old range data look fresh on the browser.
          if (Number.isFinite(data.distance?.age_ms))
            data.distance.age_ms += Math.ceil(performance.now() - started);
          return data;
        } finally {
          clearTimeout(timeout);
        }
      }
      function bestEffortRelease(auth) {
        if (auth)
          fetch("/api/release", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CyberTrack-Client": "1",
              "X-CyberTrack-Token": auth,
            },
            body: "{}",
            keepalive: true,
          }).catch(() => {});
      }
      function disconnect(text) {
        clearDistance();
        clearAllHolds();
        $("frenzy-time").textContent = "最长 30 秒";
        const old = token;
        token = "";
        epoch++;
        speedDesired = null; speedJob = null;
        clearTimeout(timer);
        pending = false;
        effectPending = false;
        snapshot = null;
        latest = -1;
        windowId = 0;
        $("connection").textContent = "未连接";
        $("connection").className = "badge";
        clearTimeout(reconnectTimer);
        connecting = false;
        for (const kind of ["move", "water", "bubbles", "ignition"]) {
          $(kind + "-time").textContent = "—";
          $(kind + "-state").textContent = "";

        }
        $("direction").textContent = "行走";
        $("drive-speed").textContent = "—";
        $("water-label").textContent = "水枪";
        $("bubbles-label").textContent = "泡泡枪";
        $("ignition-label").textContent = "点火线圈";

        controls();
        message(text, true);
        bestEffortRelease(old);
        scheduleConnect();
      }
      async function poll() {
        clearTimeout(timer);
        if (!token || document.hidden || Object.values(holds).some(Boolean)) return;
        if (polling || pending || effectPending || speedJob) {
          timer = setTimeout(poll, 100);
          return;
        }
        polling = true;
        let finishPoll;
        pollWait = new Promise((resolve) => {
          finishPoll = resolve;
        });
        const e = epoch;
        try {
          const s = await request("/api/state");
          if (e !== epoch) return;
          if (s.result !== "ok") throw new Error(s.result);
          render(s);
        } catch (err) {
          if (e === epoch)
            disconnect(
              reasons[err.message] ||
                "连接中断，动作状态未知。请确认设备已停止后重新接管。",
            );
        } finally {
          polling = false;
          finishPoll();
          if (e === epoch && token) {
            const cooling = [snapshot?.move_cooldown_ms, snapshot?.water_cooldown_ms, snapshot?.bubbles_cooldown_ms, snapshot?.ignition_cooldown_ms].filter(ms => ms > 0);
            // Leave room for sample age and LAN latency before the 500 ms expiry.
            const interval = snapshot?.capabilities?.distance === true ? 200 : 500;
            timer = setTimeout(poll, cooling.length ? Math.min(interval, ...cooling) : interval);
          }
        }
      }
      let reconnectTimer = null, connecting = false, online = true;
      function scheduleConnect() {
        clearTimeout(reconnectTimer);
        if (!document.hidden && online && !token)
          reconnectTimer = setTimeout(connect, 1500);
      }
      async function connect() {
        clearTimeout(reconnectTimer);
        if (document.hidden || !online || token || connecting) return;
        connecting = true;
        const e = ++epoch;
        $("connection").textContent = "连接中";
        try {
          const s = await request("/api/pair", {}, "");
          if (e !== epoch || document.hidden || !online) {
            bestEffortRelease(s.token);
            return;
          }
          token = s.token;
          sequence = 0;
          latest = -1;
          $("connection").textContent = "已连接";
          $("connection").className = "badge on";
          message("");
          controls();
          await poll();
        } catch (err) {
          if (e === epoch) {

            message(reasons[err.message] || "连接中断，正在重连。", true);
          }

          if (e === epoch) { connecting = false; scheduleConnect(); }

      function queueStart(work) {

        return next;
      }
      async function changeSpeed() {
        if ($("move-speed").disabled) return;
        const value = Number($("move-speed").value);
        if (!Number.isInteger(value) || value < 60 || value > 100) return;
        speedDesired = value;
        $("speed-value").textContent = value + "%";
        if (speedJob) return;
        const job = { epoch };
        speedJob = job;
        try {
          await queueStart(async () => {
            while (speedJob === job && job.epoch === epoch && speedDesired !== null && !document.hidden) {
              await pollWait;
              if (speedJob !== job || job.epoch !== epoch || document.hidden) return;
              const fresh = await request("/api/state", {}, token, 400);
              if (speedJob !== job || job.epoch !== epoch || document.hidden) return;
              if (fresh.result !== "ok") throw new Error(fresh.result);
              render(fresh);
              if ($("move-speed").disabled) { speedDesired = null; return; }
              const speed = speedDesired;
              const result = await request("/api/action", {
                operation: "set_speed", sequence: ++sequence, window: fresh.window, speed_percent: speed,
              }, token, 400);
              if (speedJob !== job || job.epoch !== epoch) return;

            }

          }
        }
      }
      async function action(kind = "water", duration = 1000) {
        if (!["water", "bubbles", "ignition", "frenzy"].includes(kind)) return;
        const label = { water: "喷水", bubbles: "吹泡泡", ignition: "点火", frenzy: "狂暴模式" }[kind];
        if (!token || pending || effectPending || holds[kind] || !snapshot || snapshot.frenzy_remaining_ms) return;
        if (kind === "frenzy" && (snapshot.capabilities?.frenzy !== true || Object.values(holds).some(Boolean))) return;
        const e = epoch;
        effectPending = true;
        controls();
        try {
          await queueStart(async () => {
          await pollWait;
          if (e !== epoch || document.hidden) return;
          const fresh = await request("/api/state");
          if (e !== epoch || document.hidden) return;
          if (fresh.result !== "ok") throw new Error(fresh.result);
          render(fresh);
          const s = await request("/api/action", {
            sequence: ++sequence, window: fresh.window, operation: kind,
            duration_ms: duration,

      function holdSeconds(h) {

        h.clockTimer = setTimeout(() => updateHoldTime(h), 100);
      }
      function clearHold(kind = "move") {
        const previous = holds[kind];
        holds[kind] = null;
        if (previous) {
          clearTimeout(previous.timer);
          clearTimeout(previous.clockTimer);

          display.textContent = kind === "move" ? "本次按住 " + holdSeconds(previous) + " 秒" : holdSeconds(previous) + "s";

        message("正在停止" + h.label + "…");
        try {
          const s = await request(
            "/api/action",
            { operation: h.prefix + "_stop", hold_id: h.id },
            token,
            400,
          );

          if (s.result !== "ok") throw new Error(s.result);
          render(s);
          message(h.label + "已停止。");
        } catch (err) {
          if (e === epoch)
            disconnect(
              "停止回执未确认，已停止续租并请求全部停止。请检查设备。",
            );
        } finally {
          if (e === epoch) {
            pending = false;
            controls();
            poll();
          }
        }

      async function renewHold(h) {
        if (holds[h.kind] !== h || document.hidden || h.epoch !== epoch) return;

          const s = await request(
            "/api/action",
            { operation: h.prefix + "_renew", hold_id: h.id, renewal: h.renewal },
            token,
            400,

            disconnect(
              "长按连接中断，已请求停止；不会自动恢复。",
            );
        }
      }
      async function beginHold(button, pointer = null) {
        const kind = button.dataset.hold || "move";
        if (!token || pending || holds[kind] || button.disabled || document.hidden)
          return;
        const h = {
          id: 0,
          kind,
          prefix: kind === "move" ? "drive" : kind,
          label: {move:"行走",water:"喷水",bubbles:"吹泡泡"}[kind],
          button,
          pointer,
          epoch,
          renewal: 0,
          startedAt: performance.now(),
          clockTimer: null,
          timer: null,
        };

        $(h.kind === "move" ? "hold-time" : h.kind + "-hold-time").className = h.kind === "move" ? "hint timing" : "timing";
        updateHoldTime(h);
        clearTimeout(timer);

          try {
            button.setPointerCapture(pointer);

        await pollWait;
        if (holds[h.kind] !== h || h.epoch !== epoch || document.hidden) return;

          const fresh = await request("/api/state", {}, token, 400);
          if (holds[h.kind] !== h || h.epoch !== epoch || document.hidden) return;
          if (fresh.result !== "ok") throw new Error(fresh.result);
          render(fresh);

          if (holds[h.kind] === h && h.epoch === epoch) disconnect("连接中断，长按已取消。");
          return;
        }

        const body = {
          operation: h.prefix + "_start", sequence: h.id, window: windowId,
          ...(kind === "move" ? {direction: button.dataset.direction} : {}),
        };
        try {
          const s = await request("/api/action", body, token, 400);
          if (holds[h.kind] !== h || h.epoch !== epoch) return;
          if (s.result === "voice_preempted" || s.result === "not_ready_or_busy") {
            clearHold(kind); render(s); message(reasons[s.result]); controls(); poll(); return;
          }
          if (s.result !== "accepted" || s[h.prefix + "_hold_id"] !== h.id)
            throw new Error(s.result);
          h.renewal = s[h.prefix + "_renewal"];
          render(s);
          message(
            "正在" +
              (kind === "move" ? directions[button.dataset.direction] : h.label) +
              "，松开停止。",
          );
          h.timer = setTimeout(() => renewHold(h), 150);
        } catch (err) {
          if (holds[h.kind] === h && h.epoch === epoch)
            disconnect(
              reasons[err.message] || "长按未确认，已停止续租并请求全部停止。",
            );
        }
        });

            (event.key === " " || event.key === "Enter") &&

            event.preventDefault();
            endHold(kind);
          }

          if (holds[kind]?.button === button && holds[kind].pointer === null) endHold(kind);

      });
      $("move-speed").addEventListener("input", changeSpeed);
      $("stop").addEventListener("click", async () => {
        if (!token) return;
        clearAllHolds();
        const e = ++epoch;
        speedDesired = null; speedJob = null;
        effectPending = false;
        pending = true;
        controls();
        message("正在请求全部停止…");
        try {
          const s = await request("/api/stop");
          if (e !== epoch) return;
          render(s);
          if (s.result !== "ok") throw new Error(s.result);
          message("全部停止。");
        } catch (err) {
          if (e === epoch)
            disconnect("停止回执未确认。请使用设备 BOOT 按键确认停止。");
        } finally {
          if (e === epoch) {
            pending = false;
            controls();
            poll();
          }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden)
          disconnect("页面已离开，网页动作已请求停止。");

      });
      window.addEventListener("blur", () => {
        if (Object.values(holds).some(Boolean) || snapshot?.frenzy_remaining_ms || effectPending) disconnect("页面失去焦点，已请求停止并释放。");
      });
      window.addEventListener("pagehide", () => disconnect("页面已关闭。"));
      window.addEventListener("offline", () => {
        online = false; disconnect("网络已断开，网页动作已请求停止。");
